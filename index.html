<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0" />
    <link rel="icon" type="image/png" href="https://i.imghippo.com/files/WXB3962h.png" />
    <title>eBhinneka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #3988d8;
        background-image: none;
        min-height: 100vh;
        color: #1e293b;
        transition: background-color 0.3s ease, color 0.3s ease;
        position: relative;
        overflow-x: hidden;
      }
      
      /* Circle Accessory in Top Left */
      body::before {
        content: '';
        position: fixed;
        top: -150px;
        left: -150px;
        width: 400px;
        height: 400px;
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        z-index: -1;
        pointer-events: none;
      }

      /* Dark Mode Body Override */
      html.dark body {
        background-color: #02183b; /* dark blue */
        color: #f1f5f9; /* slate-100 */
      }
      html.dark body::before {
        background-color: rgba(255, 255, 255, 0.05);
      }
      
      /* Card Utility - Glassmorphism */
      .app-card {
        background: rgba(241, 245, 249, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 1.25rem; 
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        transition: background-color 0.3s ease, border-color 0.3s ease;
        color: #1e293b;
      }

      /* Dark Mode Card Override */
      html.dark .app-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-color: rgba(255, 255, 255, 0.1);
        color: #f8fafc;
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 10px;
      }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #475569;
      }
      
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* MODERN PAGE TRANSITION */
      .page-enter {
        animation: pageSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes pageSlideUp {
        0% {
          opacity: 0;
          transform: translateY(15px) scale(0.98);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Animated Glow Border */
      .glow-border-container {
        position: relative;
        z-index: 0;
        border-radius: 1rem; /* match button rounding approx */
        overflow: hidden;
        padding: 3px;
      }
      .glow-border-container::before {
        content: '';
        position: absolute;
        z-index: -2;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: 50% 50%, 50% 50%;
        background-position: 0 0, 100% 0, 100% 100%, 0 100%;
        background-image: conic-gradient(from 0deg, transparent 0 340deg, #fb923c 360deg);
        animation: rotate 4s linear infinite;
      }
      .glow-border-container::after {
        content: '';
        position: absolute;
        z-index: -1;
        left: 3px;
        top: 3px;
        width: calc(100% - 6px);
        height: calc(100% - 6px);
        background: white; /* or the button bg */
        border-radius: 0.9rem;
      }
      html.dark .glow-border-container::after {
        background: #1e293b;
      }
      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      
      /* Glowing Text */
      .glowing-text {
        background: linear-gradient(to right, #f8fafc 20%, #3b82f6 50%, #f8fafc 80%);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shine 3s linear infinite;
      }
      
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }
    
      @keyframes shrinkToTopRight {
        0% { transform: scale(1) translate(0, 0); opacity: 1; }
        20% { transform: scale(1.1) translate(0, 0); opacity: 1; }
        100% { transform: scale(0.2) translate(40vw, -40vh); opacity: 0; }
      }
      .animate-shrink-to-top-right {
        animation: shrinkToTopRight 1.5s cubic-bezier(0.5, 0, 0.2, 1) forwards;
      }
    
    </style>
  <script type="importmap">{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1"
  }
}</script></head>
  <body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <!-- Entry point untuk Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
